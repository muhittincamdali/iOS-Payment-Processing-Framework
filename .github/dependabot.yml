version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/Examples/ReceiptServer"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      npm:
        patterns:
          - "*"
